<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistir</title>
<style>
  :root { --bg: #0f1115; --fg: #e8eaf0; --muted: #9aa3b2; --accent: #4f8cff; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f5f6fa; --fg: #1b1f29; --muted: #5b6475; --accent: #2563eb; }
  }
  :root[data-theme="light"] { --bg: #f5f6fa; --fg: #1b1f29; --muted: #5b6475; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
  header { padding: 12px 16px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; }
  .stage { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; background: rgba(0,0,0,.55); text-align: center; padding: 16px; }
  .overlay[hidden] { display: none; }
  button, input { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  input { background: #fff; color: #111; border-color: #999; min-width: 200px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { background: transparent; color: var(--accent); }
  @media (max-width: 600px) { header { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<header>
  <span id="status">Conectando…</span>
  <div class="controls">
    <button id="mute" type="button">Mudo</button>
    <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
    <button id="fullscreen" type="button">Tela cheia</button>
  </div>
</header>
<main>
  <div class="stage">
    <video id="video" autoplay playsinline></video>
    <div id="sound" class="overlay" hidden>
      <p>O navegador bloqueou o som automático.</p>
      <button id="enable-sound" type="button">Ativar som</button>
    </div>
    <form id="password-form" class="overlay" hidden>
      <p>Esta sala tem senha.</p>
      <input id="password" type="password" autocomplete="off" aria-label="Senha">
      <button type="submit">Entrar</button>
    </form>
    <div id="message" class="overlay" hidden><p id="message-text"></p></div>
  </div>
</main>
<script>
(() => {
  const token = location.pathname.startsWith('/s/') ? location.pathname.slice(3) : '';
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const soundBox = document.getElementById('sound');
  const passwordForm = document.getElementById('password-form');
  const messageBox = document.getElementById('message');
  const messageText = document.getElementById('message-text');
  const RETRY_MS = 2000;
  const MAX_RETRIES = 20;
  let ws = null;
  let pc = null;
  let retries = 0;
  let retryTimer = null;

  function setStatus(text) { statusEl.textContent = text; }
  function showMessage(text) {
    messageText.textContent = text;
    messageBox.hidden = false;
  }

  function wsUrl() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    return `${scheme}://${location.host}/ws/${encodeURIComponent(token)}`;
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // Depois que o usuário liberou o som uma vez, as reconexões tocam com som. Se o navegador
  // bloquear, toca mudo (a imagem nunca fica parada) e mostra o botão para ativar o som.
  let soundOn = false;
  function startPlayback() {
    video.muted = !soundOn;
    const attempt = video.play();
    if (!attempt || !attempt.catch) return;
    attempt.then(() => { if (soundOn) soundBox.hidden = true; }).catch(() => {
      soundOn = false;
      video.muted = true;
      soundBox.hidden = false;
      video.play().catch(() => {});
    });
  }

  function closePeer() {
    if (pc) { pc.close(); pc = null; }
  }

  let lastFrames = -1;
  let stalledTicks = 0;
  let disconnectTimer = null;

  // Reconexão completa: derruba WS e peer, e tenta de novo.
  function reconnect() {
    if (ws) { ws.onclose = null; try { ws.close(); } catch { /* já fechado */ } ws = null; }
    scheduleRetry();
  }

  // Vigia: se o vídeo não avança por ~6 s com a conexão "conectada", reconecta.
  setInterval(async () => {
    send({ type: 'ping' }); // mantém o WebSocket vivo atrás do Cloudflare
    if (!pc || pc.connectionState !== 'connected') { stalledTicks = 0; lastFrames = -1; return; }
    let frames = 0;
    try {
      const stats = await pc.getStats();
      stats.forEach((r) => { if (r.type === 'inbound-rtp' && r.kind === 'video') frames = r.framesDecoded || 0; });
    } catch { return; }
    if (frames > lastFrames) { lastFrames = frames; stalledTicks = 0; return; }
    stalledTicks += 1;
    if (stalledTicks >= 3) { stalledTicks = 0; lastFrames = -1; reconnect(); }
  }, 2000);

  function scheduleRetry() {
    closePeer();
    if (retries >= MAX_RETRIES) { setStatus('Conexão perdida.'); return; }
    retries += 1;
    setStatus(`Reconectando… (${retries})`);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, RETRY_MS);
  }

  async function handleOffer(sdp) {
    closePeer();
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.ontrack = (event) => {
      if (event.streams && event.streams[0]) {
        video.srcObject = event.streams[0];
      } else {
        const stream = video.srcObject instanceof MediaStream ? video.srcObject : new MediaStream();
        stream.addTrack(event.track);
        video.srcObject = stream;
      }
      startPlayback();
    };
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        send({ type: 'ice', candidate: {
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        } });
      }
    };
    pc.onconnectionstatechange = () => {
      if (!pc) return;
      clearTimeout(disconnectTimer);
      if (pc.connectionState === 'connected') { retries = 0; setStatus('Ao vivo'); }
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') reconnect();
      if (pc.connectionState === 'disconnected') disconnectTimer = setTimeout(reconnect, 4000);
    };
    await pc.setRemoteDescription({ type: 'offer', sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({ type: 'answer', sdp: pc.localDescription.sdp });
  }

  function connect() {
    if (!token) { setStatus('Link inválido.'); return; }
    ws = new WebSocket(wsUrl());
    ws.onopen = () => setStatus('Conectando…');
    ws.onmessage = async (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      switch (msg.type) {
        case 'auth_required':
          passwordForm.hidden = false;
          setStatus('Informe a senha');
          break;
        case 'offer':
          passwordForm.hidden = true;
          try { await handleOffer(msg.sdp); } catch (err) { showMessage('Falha ao negociar a conexão.'); }
          break;
        case 'ice':
          if (pc && msg.candidate) {
            try {
              await pc.addIceCandidate({
                candidate: msg.candidate.candidate,
                sdpMid: msg.candidate.sdpMid,
                sdpMLineIndex: msg.candidate.sdpMLineIndex,
              });
            } catch { /* candidato ignorado */ }
          }
          break;
        case 'error':
          showMessage(msg.message);
          ws.onclose = null;
          closePeer();
          break;
      }
    };
    ws.onclose = () => { if (!messageBox.hidden) return; scheduleRetry(); };
  }

  passwordForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    send({ type: 'auth', password });
    passwordForm.hidden = true;
  });

  document.getElementById('enable-sound').addEventListener('click', () => {
    soundOn = true;
    video.muted = false;
    video.play().catch(() => {});
    soundBox.hidden = true;
    muteButton.textContent = 'Mudo';
  });

  const muteButton = document.getElementById('mute');
  muteButton.addEventListener('click', () => {
    video.muted = !video.muted;
    soundOn = !video.muted;
    muteButton.textContent = video.muted ? 'Som' : 'Mudo';
  });

  const volume = document.getElementById('volume');
  volume.addEventListener('input', () => {
    video.volume = Number(volume.value);
    video.muted = video.volume === 0;
    soundOn = !video.muted;
    muteButton.textContent = video.muted ? 'Som' : 'Mudo';
  });

  document.getElementById('fullscreen').addEventListener('click', () => {
    const target = video.parentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (target.requestFullscreen) target.requestFullscreen();
  });

  connect();
})();
</script>
</body>
</html>
