<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistir</title>
<style>
  /* Estilo de terminal (TUI), igual ao do painel de controle. */
  :root {
    color-scheme: dark;
    --bg: #070908; --fg: #e4ebe3; --muted: #a2afa5; --line: #4a574e; --accent: #7ee787;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; }
  header { padding: 10px 16px; color: var(--fg); display: flex; justify-content: space-between; align-items: center; gap: 8px 2ch; flex-wrap: wrap; }
  #status::before { content: "> "; color: var(--accent); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; }
  .stage { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); overflow: hidden; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--fg); background: rgba(0, 0, 0, .8); text-align: center; padding: 16px; }
  .overlay p { margin: 0; max-width: 44ch; }

  /* Botões: [ rótulo ], com vídeo invertido no foco e ao passar o mouse. */
  button, input { font: inherit; border-radius: 0; }
  button { padding: 1px 0.5ch; border: 0; background: transparent; color: var(--accent); cursor: pointer; white-space: nowrap; }
  button::before { content: "[ "; }
  button::after { content: " ]"; }
  button:hover, button:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  .overlay button { background: var(--bg); }
  .overlay button:hover, .overlay button:focus-visible { background: var(--accent); }

  input[type="password"] { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 5px 1ch; width: 24ch; max-width: 100%; }
  input[type="password"]:focus-visible { border-color: var(--accent); outline: none; }

  .controls { display: flex; gap: 4px 2ch; align-items: center; flex-wrap: wrap; }

  /* Volume: trilho de células de bloco e polegar retangular. */
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 14ch; height: 20px; margin: 0; padding: 0; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 12px; background: repeating-linear-gradient(to right, var(--line) 0, var(--line) calc(1ch - 2px), transparent calc(1ch - 2px), transparent 1ch); }
  input[type="range"]::-moz-range-track { height: 12px; background: repeating-linear-gradient(to right, var(--line) 0, var(--line) calc(1ch - 2px), transparent calc(1ch - 2px), transparent 1ch); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 1ch; height: 18px; margin-top: -3px; background: var(--accent); border: 0; border-radius: 0; }
  input[type="range"]::-moz-range-thumb { width: 1ch; height: 18px; background: var(--accent); border: 0; border-radius: 0; }
  input[type="range"]:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 600px) { header { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<header>
  <span id="status">Conectando…</span>
  <div class="controls">
    <button id="mute" type="button">Mudo</button>
    <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
    <button id="fullscreen" type="button">Tela cheia</button>
  </div>
</header>
<main>
  <div class="stage">
    <video id="video" autoplay playsinline></video>
    <div id="sound" class="overlay" hidden>
      <p>O navegador bloqueou o som automático.</p>
      <button id="enable-sound" type="button">Ativar som</button>
    </div>
    <form id="password-form" class="overlay" hidden>
      <p>Esta sala tem senha.</p>
      <input id="password" type="password" autocomplete="off" aria-label="Senha">
      <button type="submit">Entrar</button>
    </form>
    <div id="message" class="overlay" hidden><p id="message-text"></p></div>
  </div>
</main>
<script>
(() => {
  const token = location.pathname.startsWith('/s/') ? location.pathname.slice(3) : '';
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const soundBox = document.getElementById('sound');
  const passwordForm = document.getElementById('password-form');
  const messageBox = document.getElementById('message');
  const messageText = document.getElementById('message-text');
  const RETRY_MS = 2000;
  const MAX_RETRIES = 20;
  let ws = null;
  let pc = null;
  let retries = 0;
  let retryTimer = null;

  function setStatus(text) { statusEl.textContent = text; }
  function showMessage(text) {
    messageText.textContent = text;
    messageBox.hidden = false;
  }

  function wsUrl() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    return `${scheme}://${location.host}/ws/${encodeURIComponent(token)}`;
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // Depois que o usuário liberou o som uma vez, as reconexões tocam com som. Se o navegador
  // bloquear, toca mudo (a imagem nunca fica parada) e mostra o botão para ativar o som.
  let soundOn = false;
  function startPlayback() {
    video.muted = !soundOn;
    const attempt = video.play();
    if (!attempt || !attempt.catch) return;
    attempt.then(() => { if (soundOn) soundBox.hidden = true; }).catch(() => {
      soundOn = false;
      video.muted = true;
      soundBox.hidden = false;
      video.play().catch(() => {});
    });
  }

  function closePeer() {
    if (pc) { pc.close(); pc = null; }
  }

  let lastFrames = -1;
  let stalledTicks = 0;
  let disconnectTimer = null;
  let lastReason = 'iniciou';
  let totalReconnects = 0; // não zera ao reconectar, ao contrário de `retries`
  let prevStatsBytes = -1;
  let prevStatsTime = 0;

  // Reconexão completa: derruba WS e peer, e tenta de novo.
  function reconnect() {
    if (ws) { ws.onclose = null; try { ws.close(); } catch { /* já fechado */ } ws = null; }
    scheduleRetry();
  }

  function triggerReconnect(reason) {
    lastReason = reason;
    reconnect();
  }

  // Vigia mais tolerante: se o vídeo não avança por ~10 s com a conexão "conectada":
  // ao detectar vídeo parado (primeiro tick), pede keyframe e só reconecta se continuar parado ~10 s no total.
  setInterval(async () => {
    send({ type: 'ping' }); // mantém o WebSocket vivo atrás do Cloudflare
    if (!pc || pc.connectionState !== 'connected') { stalledTicks = 0; lastFrames = -1; return; }
    // Aba em segundo plano: o navegador para de decodificar o vídeo de propósito.
    // Não é travamento; reconectar aqui gerava um laço de reconexões.
    if (document.hidden) { stalledTicks = 0; lastFrames = -1; return; }
    let frames = 0;
    try {
      const stats = await pc.getStats();
      stats.forEach((r) => { if (r.type === 'inbound-rtp' && r.kind === 'video') frames = r.framesDecoded || 0; });
    } catch { return; }
    if (frames > lastFrames) { lastFrames = frames; stalledTicks = 0; return; }
    stalledTicks += 1;
    if (stalledTicks === 1 || stalledTicks === 3) {
      send({ type: 'keyframe' });
    }
    if (stalledTicks >= 5) {
      stalledTicks = 0;
      lastFrames = -1;
      triggerReconnect('travou');
    }
  }, 2000);

  // Relatório de saúde a cada 5 s
  setInterval(async () => {
    if (!pc || pc.connectionState !== 'connected') return;
    let rtt_ms = 0;
    let path = 'direct';
    let loss_pct = 0;
    let fps = 0;
    let kbps = 0;

    try {
      const stats = await pc.getStats();
      let activePair = null;
      const candidates = new Map();
      stats.forEach((r) => {
        if (r.type === 'candidate-pair' && (r.nominated || r.state === 'succeeded' || r.selected)) {
          activePair = r;
        }
        if (r.type === 'local-candidate' || r.type === 'remote-candidate') {
          candidates.set(r.id, r);
        }
      });
      if (activePair) {
        if (typeof activePair.currentRoundTripTime === 'number') {
          rtt_ms = Math.round(activePair.currentRoundTripTime * 1000);
        } else if (typeof activePair.roundTripTime === 'number') {
          rtt_ms = Math.round(activePair.roundTripTime * 1000);
        }
        const local = candidates.get(activePair.localCandidateId);
        const remote = candidates.get(activePair.remoteCandidateId);
        if ((local && local.candidateType === 'relay') || (remote && remote.candidateType === 'relay')) {
          path = 'relay';
        }
      }

      stats.forEach((r) => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') {
          const lost = r.packetsLost || 0;
          const received = r.packetsReceived || 0;
          const total = lost + received;
          if (total > 0 && lost >= 0) {
            loss_pct = Math.round((lost / total) * 1000) / 10;
          }
          if (typeof r.framesPerSecond === 'number') {
            fps = Math.round(r.framesPerSecond);
          }
          if (prevStatsTime && prevStatsBytes >= 0 && r.timestamp > prevStatsTime) {
            const deltaMs = r.timestamp - prevStatsTime;
            if (r.bytesReceived >= prevStatsBytes) {
              kbps = Math.round(((r.bytesReceived - prevStatsBytes) * 8) / deltaMs);
            }
          }
          prevStatsBytes = r.bytesReceived || 0;
          prevStatsTime = r.timestamp;
        }
      });
    } catch {
      return;
    }

    send({
      type: 'stats',
      rtt_ms,
      loss_pct,
      fps,
      kbps,
      path,
      reconnects: totalReconnects,
      last_reason: lastReason,
    });
  }, 5000);

  // Ao voltar para a aba, recomeça a contagem do vigia do zero.
  document.addEventListener('visibilitychange', () => { stalledTicks = 0; lastFrames = -1; });

  function scheduleRetry() {
    closePeer();
    if (retries >= MAX_RETRIES) { setStatus('Conexão perdida.'); return; }
    retries += 1;
    totalReconnects += 1;
    setStatus(`Reconectando… (${retries})`);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, RETRY_MS);
  }

  // Servidores ICE (STUN + TURN) enviados pelo servidor. Sem o campo, usa só o STUN padrão.
  function iceServersFrom(list) {
    if (!Array.isArray(list) || list.length === 0) return [{ urls: 'stun:stun.l.google.com:19302' }];
    return list;
  }

  async function handleOffer(sdp, iceServers) {
    closePeer();
    pc = new RTCPeerConnection({ iceServers: iceServersFrom(iceServers) });
    pc.ontrack = (event) => {
      if (event.streams && event.streams[0]) {
        video.srcObject = event.streams[0];
      } else {
        const stream = video.srcObject instanceof MediaStream ? video.srcObject : new MediaStream();
        stream.addTrack(event.track);
        video.srcObject = stream;
      }
      startPlayback();
    };
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        send({ type: 'ice', candidate: {
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        } });
      }
    };
    pc.onconnectionstatechange = () => {
      if (!pc) return;
      clearTimeout(disconnectTimer);
      if (pc.connectionState === 'connected') { retries = 0; setStatus('Ao vivo'); }
      if (pc.connectionState === 'failed') triggerReconnect('ice-failed');
      else if (pc.connectionState === 'closed') triggerReconnect('ice-closed');
      else if (pc.connectionState === 'disconnected') disconnectTimer = setTimeout(() => triggerReconnect('ice-desconectado'), 4000);
    };
    await pc.setRemoteDescription({ type: 'offer', sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({ type: 'answer', sdp: pc.localDescription.sdp });
  }

  function connect() {
    if (!token) { setStatus('Link inválido.'); return; }
    ws = new WebSocket(wsUrl());
    ws.onopen = () => setStatus('Conectando…');
    ws.onmessage = async (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      switch (msg.type) {
        case 'auth_required':
          passwordForm.hidden = false;
          setStatus('Informe a senha');
          break;
        case 'offer':
          passwordForm.hidden = true;
          try { await handleOffer(msg.sdp, msg.ice_servers); } catch (err) { showMessage('Falha ao negociar a conexão.'); }
          break;
        case 'ice':
          if (pc && msg.candidate) {
            try {
              await pc.addIceCandidate({
                candidate: msg.candidate.candidate,
                sdpMid: msg.candidate.sdpMid,
                sdpMLineIndex: msg.candidate.sdpMLineIndex,
              });
            } catch { /* candidato ignorado */ }
          }
          break;
        case 'error':
          showMessage(msg.message);
          ws.onclose = null;
          closePeer();
          break;
      }
    };
    ws.onclose = () => {
      if (!messageBox.hidden) return;
      lastReason = 'ws-fechado';
      scheduleRetry();
    };
  }

  passwordForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    send({ type: 'auth', password });
    passwordForm.hidden = true;
  });

  document.getElementById('enable-sound').addEventListener('click', () => {
    soundOn = true;
    video.muted = false;
    video.play().catch(() => {});
    soundBox.hidden = true;
    muteButton.textContent = 'Mudo';
  });

  const muteButton = document.getElementById('mute');
  muteButton.addEventListener('click', () => {
    video.muted = !video.muted;
    soundOn = !video.muted;
    muteButton.textContent = video.muted ? 'Som' : 'Mudo';
  });

  const volume = document.getElementById('volume');
  volume.addEventListener('input', () => {
    video.volume = Number(volume.value);
    video.muted = video.volume === 0;
    soundOn = !video.muted;
    muteButton.textContent = video.muted ? 'Som' : 'Mudo';
  });

  document.getElementById('fullscreen').addEventListener('click', () => {
    const target = video.parentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (target.requestFullscreen) target.requestFullscreen();
  });

  connect();
})();
</script>
</body>
</html>
